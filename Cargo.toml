[workspace]
members = [".", "crates/symbology", "crates/dataprovider"]
resolver = "2"

[package]
name = "rustoms"
version = "0.1.0"
edition = "2021"
default-run = "oms"

# The server + setup CLI ships as the `oms` binary (`oms setup universe …`).
[[bin]]
name = "oms"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.1", features = ["json"] }
# `openidconnect` pulls in reqwest 0.12 and enables only `webpki-roots` on it,
# so the OIDC client trusts Mozilla's bundled roots and nothing else — an IdP
# behind a corporate or internal CA then fails discovery with "Request failed"
# and login is disabled for the whole run. Declaring 0.12 here unifies the
# feature set of that same shared crate so `tls_built_in_native_certs` in
# `oidc::build_http_client` has native roots available. Not used directly.
reqwest012 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
base64 = "0.22"
bcrypt = "0.15"
# Session cookie values are hashed, not bcrypted: see src/sessions.rs.
sha2 = "0.10"
toml = "0.8"
rpassword = "7"
rand = "0.8"
aes-gcm = "0.10"
databento = { version = "0.54.0", default-features = false, features = ["live", "chrono"]}
csv = "1"

# Binance request signing (Ed25519 over the query string; also for the WS-API
# session.logon). Ed25519 is the only key type Binance supports for the WebSocket
# user-data stream, so we use it for REST signing too — one credential.
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }

# Kafka producer
rdkafka = { version = "0.34", features = ["tokio"] }

# Async trait support for dyn-compatible broker adapters
async-trait = "0.1"

# Swappable broker registry: lock-free reads on the order path, atomic publish on reload.
arc-swap = "1"

scalar_api_reference = { version = "0.1.0", features = ["axum"] }

# OpenAPI spec generation
utoipa = { version = "4", features = ["uuid", "chrono"] }

# Alpaca trade-update WebSocket stream
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
domain = "0.12.1"

# In-repo instrument identification (OpenFIGI symbology engine)
symbology = { path = "crates/symbology" }

# In-repo data-provider abstraction (universe discovery + seeding + enrichment)
dataprovider = { path = "crates/dataprovider" }

# CLI (oms setup universe …)
clap = { version = "4", features = ["derive"] }

# Embed SQL and CSV assets into the binary
include_dir = "0.7"

# Content types for the embedded cockpit bundle
mime_guess = "2"

# FIX connectivity (IBKR 4.2, Binance 4.4) — Rust bindings over the QuickFIX C++
# engine. It owns the session layer (logon/heartbeat/seqnum/resend+gap-fill) and
# TLS; we implement its ApplicationCallback. Needs cmake + a C++ compiler to build.
quickfix = { version = "0.2", features = ["build-with-ssl"] }

# OIDC relying-party protocol: discovery, the code exchange, and ID-token
# verification. Not a session framework — sessions are ours (src/sessions.rs).
openidconnect = "4"

[dev-dependencies]
# Test-only: mints an in-process RSA key pair for src/oidc.rs's TestSigner, so
# ID-token verification can be tested against real signatures without an IdP.
# Already an indirect dependency of openidconnect; pinned here to use it directly.
rsa = "0.9"
# Test-only: HMACs the RS256→HS256 algorithm-confusion token in
# src/oidc.rs's TestSigner. Already an indirect dependency of openidconnect.
hmac = "0.12"
