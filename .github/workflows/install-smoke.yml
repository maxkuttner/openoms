name: Install smoke test

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: install exactly the way the landing page says to
        run: curl -fsSL https://maxkuttner.github.io/openoms/install.sh | sh

      - name: the installed binary runs and matches the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          got="$("$HOME/.local/bin/oms" --version | awk '{print $NF}')"
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "installed $got, latest release $tag"
          [ "$got" = "${tag#v}" ] || { echo "installed version does not match the latest release"; exit 1; }

      # The runner has Homebrew's openssl@3, so `oms --version` passing here proves
      # nothing about a Mac that doesn't. Check the load paths directly instead.
      - name: the macOS binary needs no Homebrew
        if: runner.os == 'macOS'
        run: |
          otool -L "$HOME/.local/bin/oms"
          ! otool -L "$HOME/.local/bin/oms" | grep -qi 'homebrew\|openssl'

      - name: the binary carries the cockpit
        run: |
          "$HOME/.local/bin/oms" --help >/dev/null
          # The embed is bytes inside the binary, so grep for a string only the
          # built bundle contributes. A UI-less release would pass every other
          # check in this workflow.
          grep -qa 'oms-cockpit\|<div id="root">' "$HOME/.local/bin/oms" \
            || { echo "no cockpit bundle found in the released binary"; exit 1; }

  brew:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: macos-14
    steps:
      - name: install exactly the way the docs say to
        run: brew install maxkuttner/tap/openoms

      - name: the formula installs the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          got="$(oms --version | awk '{print $NF}')"
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "installed $got, latest release $tag"
          [ "$got" = "${tag#v}" ] || { echo "formula does not install the latest release"; exit 1; }

      - run: brew test openoms

      - name: oms update defers to brew
        run: |
          if out="$(oms update 2>&1)"; then echo "oms update replaced a brew-owned binary"; exit 1; fi
          echo "$out"
          echo "$out" | grep -q "brew upgrade openoms"

  docker:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: run exactly the way the docs say to
        run: |
          mkdir openoms && cd openoms
          curl -fsSLO https://maxkuttner.github.io/openoms/compose.yaml
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
          docker compose run --rm oms init --non-interactive
          docker compose up -d

      - name: the cockpit answers on 127.0.0.1:3001
        run: |
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3001/cockpit/ && exit 0
            sleep 2
          done
          cd openoms && docker compose logs oms
          exit 1

      - name: the image is the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd openoms
          got="$(docker compose run --rm --no-deps oms --version | awk '{print $NF}')"
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "image $got, latest release $tag"
          [ "$got" = "${tag#v}" ] || { echo "latest image is not the latest release"; exit 1; }
