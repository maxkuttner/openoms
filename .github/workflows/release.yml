name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          # 22.04, not ubuntu-latest: 24.04 links glibc 2.39 and the binary then
          # refuses to start on Debian 12 or Ubuntu 22.04, which is most servers.
          #
          # The Linux artifact also links the system OpenSSL (libssl.so.3), so it
          # needs OpenSSL 3 at runtime — present on Debian 12 and Ubuntu 22.04+,
          # absent on Ubuntu 20.04, RHEL 8 and Amazon Linux 2, which glibc alone
          # would not rule out. Documented as a requirement in the readme and on
          # the site. If it ever matters, the follow-up is linking OpenSSL
          # statically here too, the way macOS does via OMS_OPENSSL_STATIC.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: the tag must match Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
                   | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)"
          echo "tag=$tag cargo=$crate"
          [ "$tag" = "$crate" ] || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json

      - name: build the cockpit bundle
        working-directory: cockpit
        run: npm ci && npm run build

      - name: the bundle must exist before cargo embeds it
        run: test -s cockpit/dist/index.html

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # build.rs finds a Homebrew OpenSSL for the quickfix SSL link. cmake is
      # preinstalled on both runner images.
      - name: openssl
        if: runner.os == 'macOS'
        run: brew install openssl@3

      # `cargo build` with no --target builds for the runner's host triple, but the
      # tarball is named from matrix.target and install.sh picks by that name alone.
      # They agree today only because each runner's host happens to match; a runner
      # image swap would mislabel the artifact silently. --target would move the
      # output path every step below depends on, so assert instead.
      - name: the runner's host triple must match the artifact name
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "host=$host matrix=${{ matrix.target }}"
          [ "$host" = "${{ matrix.target }}" ] || {
            echo "cargo builds for $host, artifact would be named ${{ matrix.target }}"
            exit 1
          }

      - name: build
        env:
          # macOS only. Links OpenSSL statically so the published binary carries no
          # /opt/homebrew load path and runs on a Mac without Homebrew. See build.rs.
          OMS_OPENSSL_STATIC: ${{ runner.os == 'macOS' && '1' || '' }}
        run: cargo build --release

      - name: no absolute Homebrew load paths in the macOS binary
        if: runner.os == 'macOS'
        run: |
          otool -L target/release/oms
          ! otool -L target/release/oms | grep -qi 'homebrew\|openssl'

      - run: strip target/release/oms

      - name: the binary reports the tag's version
        run: |
          got="$(./target/release/oms --version | awk '{print $NF}')"
          [ "$got" = "${GITHUB_REF_NAME#v}" ] || {
            echo "binary reports $got, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: package
        run: |
          tar czf "oms-${{ matrix.target }}.tar.gz" -C target/release oms
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "oms-${{ matrix.target }}.tar.gz" > "oms-${{ matrix.target }}.sha256"
          else
            shasum -a 256 "oms-${{ matrix.target }}.tar.gz" > "oms-${{ matrix.target }}.sha256"
          fi
          cat "oms-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: oms-${{ matrix.target }}
          path: |
            oms-${{ matrix.target }}.tar.gz
            oms-${{ matrix.target }}.sha256

  # Nothing a user sees moves until every artifact built: the per-arch image
  # tags are staging only, and the release, the multi-arch tags and the tap
  # all wait on both builds.
  publish:
    needs: [build, docker]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Only the binaries: docker/build-push-action also uploads its own
      # *.dockerbuild build records as artifacts, which do not download as zips.
      - uses: actions/download-artifact@v4
        with:
          pattern: oms-*
          path: dist
          merge-multiple: true

      - name: one SHA256SUMS for the release
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  # ghcr.io/maxkuttner/openoms, one native build per arch (the C++ FIX engine is
  # far too slow under QEMU), merged into one multi-arch tag by docker-manifest.
  docker:
    name: image ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openoms:ci
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: the image reports the tag's version
        run: |
          got="$(docker run --rm openoms:ci --version | awk '{print $NF}')"
          [ "$got" = "${GITHUB_REF_NAME#v}" ] || {
            echo "image reports $got, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: push the per-arch tag
        run: |
          ref="ghcr.io/maxkuttner/openoms:${GITHUB_REF_NAME#v}-${{ matrix.arch }}"
          docker tag openoms:ci "$ref"
          docker push "$ref"

  docker-manifest:
    needs: [docker, publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: tag X.Y.Z, X.Y and latest across both arches
        run: |
          v="${GITHUB_REF_NAME#v}"
          img=ghcr.io/maxkuttner/openoms
          docker buildx imagetools create \
            -t "$img:$v" -t "$img:${v%.*}" -t "$img:latest" \
            "$img:$v-amd64" "$img:$v-arm64"
          docker buildx imagetools inspect "$img:$v"

  # Formula/openoms.rb in maxkuttner/homebrew-tap, rendered from this release's
  # SHA256SUMS. HOMEBREW_TAP_TOKEN: a fine-grained token with contents write on
  # the tap repo only.
  homebrew:
    needs: [publish, docker-manifest]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: render the formula from the release's SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS
          sh packaging/homebrew/render.sh "${GITHUB_REF_NAME#v}" SHA256SUMS > openoms.rb
          grep -q "releases/download/$GITHUB_REF_NAME/" openoms.rb
          cat openoms.rb

      - name: push to maxkuttner/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "secret HOMEBREW_TAP_TOKEN is not set"; exit 1; }
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/maxkuttner/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp openoms.rb tap/Formula/openoms.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/openoms.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          msg="openoms ${GITHUB_REF_NAME#v}"
          git commit -m "$msg"
          git push
