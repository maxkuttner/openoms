name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "install.sh"
      - "docs/openapi.json"
      # The docs' CLI-reference test reads the subcommands from here.
      - "src/main.rs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci

      # Builds the Starlight site into docs-site/dist — install.sh is copied in
      # from the repo root by the prebuild step, so the root copy stays the
      # only one — and runs the docs tests against it before anything ships.
      - run: npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

      - id: deploy
        uses: actions/deploy-pages@v4
