name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  database:
    name: database init/migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: ods
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --quiet

      - name: init on an empty server succeeds
        run: cargo run --quiet -- database init

      - name: init a second time fails loudly
        run: |
          if cargo run --quiet -- database init; then
            echo "expected the second init to fail, but it succeeded"
            exit 1
          fi

      - name: migrate is idempotent
        run: |
          cargo run --quiet -- database migrate
          out=$(cargo run --quiet -- database migrate)
          echo "$out"
          echo "$out" | grep -q "applied 0 migration" \
            || { echo "second migrate was not a no-op"; exit 1; }

      - name: status reports no pending migrations
        run: |
          out=$(cargo run --quiet -- database status)
          echo "$out"
          echo "$out" | grep -q "0 pending" || { echo "unexpected pending"; exit 1; }

      - name: database-backed tests
        env:
          OMS_RELOAD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test -- --ignored

  cockpit:
    name: cockpit bundle embeds and serves
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json

      - name: build the bundle
        working-directory: cockpit
        run: npm ci && npm run build

      - name: the bundle calls the OMS same-origin
        run: ./cockpit/check-api-base.sh
      - name: every cockpit colour comes from the palette
        run: ./cockpit/check-palette.sh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: the embed is populated and served
        run: "cargo test cockpit:: -- --nocapture"

      - name: and the embed is genuinely non-empty
        run: |
          test -s cockpit/dist/index.html \
            || { echo "cockpit/dist/index.html missing — the embed tests all no-op'd"; exit 1; }
          test -s cockpit/dist/trade.html \
            || { echo "cockpit/dist/trade.html missing — the /trade/ shell tests all no-op'd"; exit 1; }

  shellcheck:
    name: shellcheck install.sh
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on the GitHub Ubuntu images.
      - run: shellcheck install.sh install_test.sh cockpit/check-api-base.sh cockpit/check-palette.sh packaging/homebrew/*.sh
      - name: install.sh puts oms on PATH
        run: sh install_test.sh
      - name: the Homebrew formula renders from SHA256SUMS
        run: sh packaging/homebrew/render_test.sh

  docs-site:
    name: docs site build and checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # Builds the Starlight site (links validated during the build) and runs
      # docs-site/test: install.sh served byte-identical, every link resolving
      # under /openoms/, the generated API reference complete, and every `oms`
      # command in the docs a real subcommand.
      - run: npm ci
        working-directory: docs-site
      - run: npm run check
        working-directory: docs-site
      # Published at /openoms/compose.yaml for the Docker install.
      - name: compose.yaml is valid
        run: POSTGRES_PASSWORD=ci docker compose -f docs-site/public/compose.yaml config -q
