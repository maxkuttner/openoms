name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  database:
    name: database init/migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: ods
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --quiet

      - name: init on an empty server succeeds
        run: cargo run --quiet -- database init

      - name: init a second time fails loudly
        run: |
          if cargo run --quiet -- database init; then
            echo "expected the second init to fail, but it succeeded"
            exit 1
          fi

      - name: migrate is idempotent
        run: |
          cargo run --quiet -- database migrate
          out=$(cargo run --quiet -- database migrate)
          echo "$out"
          echo "$out" | grep -q "applied 0 migration" \
            || { echo "second migrate was not a no-op"; exit 1; }

      - name: status reports no pending migrations
        run: |
          out=$(cargo run --quiet -- database status)
          echo "$out"
          echo "$out" | grep -q "0 pending" || { echo "unexpected pending"; exit 1; }

      - name: database-backed tests
        env:
          OMS_RELOAD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test -- --ignored

  cockpit:
    name: cockpit bundle embeds and serves
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json

      - name: build the bundle
        working-directory: cockpit
        run: npm ci && npm run build

      - name: the bundle calls the OMS same-origin
        run: ./cockpit/check-api-base.sh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: the embed is populated and served
        run: "cargo test cockpit:: -- --nocapture"

      - name: and the embed is genuinely non-empty
        run: |
          test -s cockpit/dist/index.html \
            || { echo "cockpit/dist/index.html missing — the embed tests all no-op'd"; exit 1; }

  shellcheck:
    name: shellcheck install.sh
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on the GitHub Ubuntu images.
      - run: shellcheck install.sh cockpit/check-api-base.sh

  site:
    name: site build script tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No package.json here on purpose: node's built-in test runner needs none.
      - run: node --test site/
