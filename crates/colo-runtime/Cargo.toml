[package]
name = "colo-runtime"
version = "0.1.0"
edition = "2021"
description = "Deterministic admission, reservations and order book for a co-located runtime"

[dependencies]
gateway = { path = "../gateway", default-features = false }
risk = { path = "../risk" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
colo-link = { path = "../colo-link" }
tokio = { version = "1", features = ["full"] }
crc32fast = "1"
fs2 = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
async-trait = "0.1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
