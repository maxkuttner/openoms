[package]
name = "oms-trader-desktop"
version = "0.1.0"
edition = "2021"

# This crate lives inside the root OMS workspace directory tree but is
# excluded from it (root Cargo.toml `workspace.exclude`). An empty
# `[workspace]` table here tells Cargo this crate is its own standalone
# workspace root, so `cargo`/`cargo tauri` commands run from this directory
# don't try to resolve against the parent workspace at all, and this crate
# gets its own independent Cargo.lock.
[workspace]

[lib]
name = "oms_trader_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
