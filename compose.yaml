# openoms + PostgreSQL 16. Guide:
# https://openoms.dev/getting-started/installation/
#
#   [ -f .env ] || {
#     echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
#     echo "OMS_PASSWORD=$(openssl rand -hex 24)"
#     echo "OMS_MASTER_KEY=base64:$(openssl rand -base64 32)"
#   } > .env
#   docker compose up -d
#
# Then open http://localhost:3001/app/ — published on this machine only.
# Another port on this machine (e.g. a second install)? Add OMS_PORT=3002 to .env.
# The first start creates the database; later starts apply pending migrations.
# Reached at any other URL than http://localhost (a domain, a reverse proxy,
# Tailscale)? Add OMS_PUBLIC_BASE_URL=https://your.url to .env. Back up .env: OMS_MASTER_KEY is
# the only key to stored broker credentials.
#
# Interactive Brokers (TWS API): the OMS container cannot start IB Gateway
# itself, so run it here. Add TWS_USERID, TWS_PASSWORD and TRADING_MODE (paper
# or live) to .env, start with `docker compose --profile ibkr up -d`, and set the
# connection's Gateway address to ib-gateway:4004 (paper) or ib-gateway:4003 (live).
# https://openoms.dev/integrations/interactive-brokers/

name: openoms

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?create .env with POSTGRES_PASSWORD=... next to compose.yaml, see https://openoms.dev/getting-started/installation/}
    volumes:
      - oms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  oms:
    image: ghcr.io/maxkuttner/openoms:${OMS_VERSION:-latest}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?create .env with POSTGRES_PASSWORD=... next to compose.yaml, see https://openoms.dev/getting-started/installation/}
      # Passed through only when set: an install from before env-only setup keeps
      # these in /config/oms.toml, and env would override them.
      OMS_PASSWORD: ${OMS_PASSWORD:-}
      OMS_MASTER_KEY: ${OMS_MASTER_KEY:-}
      # The server binds 0.0.0.0 inside the container, so it cannot derive its
      # own URL; default to the port published above.
      OMS_PUBLIC_BASE_URL: ${OMS_PUBLIC_BASE_URL:-http://localhost:${OMS_PORT:-3001}}
    volumes:
      - oms-config:/config
    ports:
      - "127.0.0.1:${OMS_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in (--profile ibkr). The same pinned image the OMS starts on a host
  # (gateway::IMAGE). Reached by the OMS over this network only: no ports.
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.51.1e@sha256:85975f493bcacc8341cb42e6946c460868d165e5f64d9924b1958c8f03e7bee4
    profiles: ["ibkr"]
    environment:
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD: ${TWS_PASSWORD:-}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: "no"
      EXISTING_SESSION_DETECTED_ACTION: primary
    restart: unless-stopped

volumes:
  oms-pgdata:
  oms-config:
