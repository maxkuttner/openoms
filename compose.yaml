# openoms + PostgreSQL 16. Guide:
# https://openoms.dev/getting-started/installation/
#
#   [ -f .env ] || {
#     echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
#     echo "OMS_PASSWORD=$(openssl rand -hex 24)"
#     echo "OMS_MASTER_KEY=base64:$(openssl rand -base64 32)"
#   } > .env
#   docker compose up -d
#
# Then open http://localhost:3001/app/ — published on this machine only.
# Another port on this machine (e.g. a second install)? Add OMS_PORT=3002 to .env.
# The first start creates the database; later starts apply pending migrations.
# Reached at any other URL (a domain, a reverse proxy, Tailscale)? Add
# OMS_PUBLIC_BASE_URL=https://your.url to .env. Back up .env: OMS_MASTER_KEY is
# the only key to stored broker credentials.

name: openoms

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?create .env with POSTGRES_PASSWORD=... next to compose.yaml, see https://openoms.dev/getting-started/installation/}
    volumes:
      - oms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  oms:
    image: ghcr.io/maxkuttner/openoms:${OMS_VERSION:-latest}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?create .env with POSTGRES_PASSWORD=... next to compose.yaml, see https://openoms.dev/getting-started/installation/}
      # Passed through only when set: an install from before env-only setup keeps
      # these in /config/oms.toml, and env would override them.
      OMS_PASSWORD: ${OMS_PASSWORD:-}
      OMS_MASTER_KEY: ${OMS_MASTER_KEY:-}
      OMS_PUBLIC_BASE_URL: ${OMS_PUBLIC_BASE_URL:-}
    volumes:
      - oms-config:/config
    ports:
      - "127.0.0.1:${OMS_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oms-pgdata:
  oms-config:
