# A Postgres for openoms to run against, so "have a database somewhere" stops
# being the hardest step of the install.
#
#     docker compose up -d
#     cargo run -- init      # press Enter through every prompt
#
# Postgres only. The OMS talks to Kafka if you configure it and degrades quietly
# if you don't, so there is nothing here to bundle; adding services nobody needs
# would make this file a liability rather than a shortcut.

services:
  postgres:
    container_name: oms-postgres
    image: postgres:16
    environment:
      # Matches the built-in default so `oms init` needs no answers at all.
      #
      # The variable is OMS_DOCKER_* rather than POSTGRES_* on purpose: Compose
      # auto-loads this repo's `.env`, which already defines POSTGRES_PASSWORD for
      # the *application*. Reusing that name would silently provision this
      # container with the credentials of whatever database the app points at.
      POSTGRES_PASSWORD: ${OMS_DOCKER_POSTGRES_PASSWORD:-postgres}
      # Deliberately no POSTGRES_DB. `oms database init` creates `ods` itself and
      # refuses outright if it already exists — pre-creating it here would break
      # the very command this file exists to make easy.
    ports:
      # Loopback only. Binding 0.0.0.0 would expose the database to the network
      # *and* trip the guards that refuse the shipped default passwords off-localhost.
      - "127.0.0.1:${OMS_DOCKER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - oms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # DEV-ONLY, OPTIONAL: a disposable local SSO test provider (Authentik) for
  # exercising OIDC login end to end. The OMS works with any OIDC issuer
  # (Entra, Google, Okta, Keycloak, Authentik, ...); this is just a convenient
  # one to test against. It is not used by the deploy, and its blueprint client
  # secret `oms-dev-secret` is public, so the OMS refuses it unless the issuer
  # is on loopback: this fixture only works for local development.
  #
  # Not part of the default `docker compose up -d` — it lives under the `oidc`
  # profile, so it only starts when explicitly asked for and stays out of CI
  # and of every developer's normal Postgres-only loop:
  #
  #     docker compose --profile oidc up -d
  #     OMS_OIDC_CLIENT_SECRET=oms-dev-secret cargo run
  #
  # docker/authentik/blueprints/oms-dev.yaml is picked up by the worker on
  # boot and creates the `oms` provider + application (client secret
  # `oms-dev-secret`, redirect URIs `http://localhost:3001/auth/callback` and
  # `http://localhost:3001/auth/oidc/callback`).
  # First start takes a minute or two while Authentik migrates its database.
  # Point `oms.toml` at it:
  #
  #     [auth.oidc]
  #     issuer = "http://localhost:9000/application/o/oms/"
  #     client_id = "oms"
  #     public_base_url = "http://localhost:3001"
  #
  # Admin UI: http://localhost:9000/if/admin/ as `akadmin` / `admin` (dev-only
  # bootstrap credentials, only applied on first boot of an empty database).
  # Create users (or invite flows) there. Authentik 2026.8 needs no Redis;
  # it keeps cache and queues in its own Postgres. That Postgres is separate
  # from `postgres` above, with its own volume, and is not published to the
  # host.
  #
  # AUTHENTIK_SECRET_KEY below is a DEV-ONLY default. Never reuse it anywhere
  # real; override via the environment.
  authentik-postgres:
    container_name: oms-authentik-postgres
    image: docker.io/library/postgres:16-alpine
    profiles: ["oidc"]
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${OMS_AUTHENTIK_PG_PASSWORD:-authentik-dev-only}
    volumes:
      - oms-authentik-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  authentik-server:
    container_name: oms-authentik-server
    image: ghcr.io/goauthentik/server:2026.8.5
    profiles: ["oidc"]
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${OMS_AUTHENTIK_SECRET_KEY:-dev-only-insecure-secret-key-change-me-0123456789}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${OMS_AUTHENTIK_PG_PASSWORD:-authentik-dev-only}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${OMS_AUTHENTIK_BOOTSTRAP_PASSWORD:-admin}
      AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@example.com
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    depends_on:
      authentik-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - oms-authentik-data:/data
      - ./docker/authentik/blueprints:/blueprints/custom:ro
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  authentik-worker:
    container_name: oms-authentik-worker
    image: ghcr.io/goauthentik/server:2026.8.5
    profiles: ["oidc"]
    command: worker
    environment: *authentik-env
    depends_on:
      authentik-postgres:
        condition: service_healthy
    volumes:
      - oms-authentik-data:/data
      - ./docker/authentik/blueprints:/blueprints/custom:ro
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  oms-postgres:
  oms-authentik-pgdata:
  oms-authentik-data:
