# Dev blueprint: the `oms` OAuth2/OpenID provider and application, so the local
# Authentik needs no console clicking. DEV ONLY: the client secret below is
# public; production creates its own secret (see the setup docs).
#
# Issuer: <authentik>/application/o/oms/   (per-provider issuer mode)
# email_verified: Authentik's built-in `email` scope mapping reports
# email_verified = true for every local account. That is acceptable here
# because local accounts are enrolled through an invite that fixes the email.
version: 1
metadata:
  name: OMS dev provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: oms-provider
    identifiers:
      name: oms
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: oms
      client_secret: oms-dev-secret
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3001/auth/callback
        - matching_mode: strict
          url: https://fedora-8gb-fsn1-1.tail291892.ts.net/auth/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers:
      slug: oms
    attrs:
      name: oms
      provider: !KeyOf oms-provider
