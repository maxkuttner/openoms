# Dev blueprint: the `oms` OAuth2/OpenID provider and application, so the local
# Authentik needs no console clicking. DEV ONLY: the client secret below is
# public; production creates its own secret (see the setup docs).
#
# Issuer: <authentik>/application/o/oms/   (per-provider issuer mode)
# email_verified: a custom `email` scope mapping (below) replaces the stock one,
# which reports email_verified = true for every account. Here it is true only
# when the user's `email_verified` attribute is boolean true (set by a source, an
# invitation flow, or an admin). No enrollment flow ships with this blueprint;
# any enrollment flow you add must use an invitation stage with a fixed email.
version: 1
metadata:
  name: OMS dev provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: oms-scope-email
    identifiers:
      name: oms email (verified only when attribute set)
    attrs:
      scope_name: email
      description: Email address and whether it is verified
      expression: |
        return {
            "email": request.user.email,
            "email_verified": request.user.attributes.get("email_verified") is True,
        }
  - model: authentik_providers_oauth2.oauth2provider
    id: oms-provider
    identifiers:
      name: oms
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Authentik 2026.x allows no grant type unless listed; the OMS signs in
      # with the authorization-code flow (PKCE).
      grant_types: [authorization_code, refresh_token]
      client_id: oms
      client_secret: oms-dev-secret
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3001/auth/callback
        - matching_mode: strict
          url: https://fedora-8gb-fsn1-1.tail291892.ts.net/auth/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf oms-scope-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers:
      slug: oms
    attrs:
      name: oms
      provider: !KeyOf oms-provider
