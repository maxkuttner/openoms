# Manual test-server deploy — run by hand (or via deploy/deploy.sh), never by
# CI. Points at the box's own already-running native Postgres, so there is no
# database service here.
#
#     docker compose -f deploy/docker-compose.yml build
#     docker compose -f deploy/docker-compose.yml up -d
#
# Expects, on the host running this:
#   /opt/oms/config/oms.toml       — same master_key as whatever wrote the
#                                    target database's encrypted columns
#   /opt/oms/config/.env           — POSTGRES_PASSWORD=..., OMS_PASSWORD=...,
#                                    and (with [auth.oidc] configured)
#                                    OMS_OIDC_CLIENT_SECRET=<your provider's
#                                    real client secret>
#
# No identity provider runs here: point [auth.oidc] in oms.toml at any OIDC
# issuer you already have (see deploy/README.md). Authentik is only an opt-in
# local dev fixture (root docker-compose.yml, profile "oidc").
services:
  oms:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: oms-test-deploy
    network_mode: host
    env_file:
      - ${OMS_DEPLOY_CONFIG_DIR:-/opt/oms/config}/.env
    volumes:
      - ${OMS_DEPLOY_CONFIG_DIR:-/opt/oms/config}/oms.toml:/app/oms.toml:ro
    restart: unless-stopped
